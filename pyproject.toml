[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trading"
version = "0.1.0"
description = "Atlas Trading Systems — Phase 1 public MD + Phase 1.5 local paper engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Kaje Row" }]
dependencies = [
  "httpx>=0.27",
  "aiohttp>=3.9",
  "websockets>=12.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.110",
  "jinja2>=3.1",
  "uvicorn[standard]>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
atlas-dashboard = "atlas.dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"atlas.dashboard" = ["templates/**/*", "static/**/*", "fixtures/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
